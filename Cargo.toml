[workspace]
resolver = "2"
members = ["crates/urwa20", "crates/urwa1155", "crates/urwa721"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[workspace.dependencies]
openzeppelin-stylus = "=0.3.0"
stylus-sdk = "=0.9.0"
alloy-primitives = { version = "=0.8.20", default-features = false, features = ["tiny-keccak"] }
alloy-sol-types = { version = "=0.8.20", default-features = false }
keccak-const = "0.2.0"
motsu = "=0.10.0"

# Pinned transitive dependencies. Not used directly; the exact pins keep the build
# reproducible WITHOUT committing Cargo.lock:
#   * ruint > 1.14.0 makes stylus-sdk 0.9.0 fail to compile (a to_be_bytes::<32> const panic).
#   * arbitrary / derive_arbitrary must be the SAME version (a 1.4.1 vs 1.4.2 skew makes
#     alloy-primitives' `arbitrary` feature, pulled in by motsu in dev/test builds, fail).
ruint = { version = "=1.14.0", default-features = false }
arbitrary = "=1.4.1"
derive_arbitrary = "=1.4.1"

[profile.release]
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
lto = true
debug = false
rpath = false
debug-assertions = false
incremental = false
