[package]
name = "urwa-stylus"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "ERC-7943 (uRWA) Universal Real World Asset token implementation for Arbitrum Stylus"
readme = "README.md"

[dependencies]
openzeppelin-stylus = "=0.3.0"
stylus-sdk = "=0.9.0"
alloy-primitives = { version = "=0.8.20", default-features = false, features = ["tiny-keccak"] }
alloy-sol-types = { version = "=0.8.20", default-features = false }
keccak-const = "0.2.0"

[dev-dependencies]
motsu = "=0.10.0"

[features]
export-abi = ["openzeppelin-stylus/export-abi", "stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "urwa-stylus"
path = "src/main.rs"

[profile.release]
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
lto = true
debug = false
rpath = false
debug-assertions = false
incremental = false
