[workspace]
resolver = "2"
members = ["crates/urwa20", "crates/urwa1155"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[workspace.dependencies]
openzeppelin-stylus = "=0.3.0"
stylus-sdk = "=0.9.0"
alloy-primitives = { version = "=0.8.20", default-features = false, features = ["tiny-keccak"] }
alloy-sol-types = { version = "=0.8.20", default-features = false }
keccak-const = "0.2.0"
motsu = "=0.10.0"

[profile.release]
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
lto = true
debug = false
rpath = false
debug-assertions = false
incremental = false
