[package]
name = "urwa721"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ERC-7943 (uRWA) non-fungible (deed/title) Real World Asset implementation for Arbitrum Stylus"

[dependencies]
openzeppelin-stylus.workspace = true
stylus-sdk.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
keccak-const.workspace = true
ruint.workspace = true # resolver pin only; see workspace Cargo.toml

[dev-dependencies]
motsu.workspace = true
arbitrary.workspace = true # resolver pin only; see workspace Cargo.toml
derive_arbitrary.workspace = true # resolver pin only; see workspace Cargo.toml

[features]
export-abi = ["openzeppelin-stylus/export-abi", "stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "urwa721"
path = "src/main.rs"
